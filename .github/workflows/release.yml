name: Release
# Builds the Windows portable ZIP and the Ubuntu 24.04 package from one commit,
# runs the same checks as CI, and publishes both as a GitHub release whose
# notes come from docs/releases/<tag>.md (first line "# Title").
# Push a tag such as v0.5.0 on a commit whose CMakeLists.txt has that version,
# or run it by hand to release an earlier commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.4.0'
        required: true
        type: string
      ref:
        description: 'Full commit SHA to build; the tag is created there when published'
        required: true
        type: string
      latest:
        description: 'Mark as the latest release'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || github.sha }}
  GH_REPO: ${{ github.repository }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Create a draft release with its notes (or refresh an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then echo "::error::Missing $notes"; exit 1; fi
          title="$(head -n 1 "$notes" | sed 's/^# *//')"
          tail -n +2 "$notes" > body.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file body.md
          else
            gh release create "$TAG" --draft --target "$REF" --title "$title" --notes-file body.md
          fi

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.REF }}
      - name: Check the tag matches the project version
        run: |
          if ! grep -q "project(ConsoleObservatory VERSION ${TAG#v} " CMakeLists.txt; then
            echo "::error::CMakeLists.txt at ${REF} is not version ${TAG#v}"; exit 1
          fi
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 qt6-base-dev qt6-base-dev-tools xvfb xauth
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOBSERVATORY_STRICT_DEPENDENCIES=ON
          cmake --build build --parallel 2
      - name: Verify (all CTest suites and native X11 widgets)
        run: |
          ctest --test-dir build --output-on-failure
          xvfb-run -a ./build/widget_tests
      - name: Package and attach the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmake --install build --prefix "$PWD/out/install"
          cpack --config build/CPackConfig.cmake -B out
          dpkg-deb --info out/console-observatory_*_amd64.deb
          gh release upload "$TAG" out/console-observatory_*_amd64.deb --clobber

  windows:
    needs: prepare
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.REF }}
      - name: Check the tag matches the project version
        run: |
          $version = "$env:TAG".TrimStart('v')
          if (-not (Select-String -Path CMakeLists.txt -SimpleMatch "project(ConsoleObservatory VERSION $version ")) {
            Write-Error "CMakeLists.txt at $env:REF is not version $version"; exit 1
          }
      - name: Install official Qt 6.8.3 for MinGW, with its MinGW 13.1 toolchain and Ninja
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310 tools_ninja'
          cache: true
      - name: Build with Qt's MinGW kit
        run: |
          $tools = "$env:IQTA_TOOLS".Replace('\', '/')
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$tools/mingw1310_64/bin/gcc.exe" `
            "-DCMAKE_CXX_COMPILER=$tools/mingw1310_64/bin/g++.exe" `
            "-DCMAKE_MAKE_PROGRAM=$tools/Ninja/ninja.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --parallel
      - name: Verify (all CTest suites and widgets on the native Windows platform)
        run: |
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = 'windows'
          ./build/widget_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package the portable ZIP with windeployqt
        run: |
          cmake --install build --prefix out/install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cpack --config build/CPackConfig.cmake -B out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Launch the packaged app from a clean folder, then attach the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem out/console-observatory-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/packaged" -Force
          $app = Get-ChildItem "$env:RUNNER_TEMP/packaged" -Recurse -Filter console-observatory.exe | Select-Object -First 1
          $savedPath = $env:PATH
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $shot = "$env:RUNNER_TEMP/packaged-app.png"
          $run = Start-Process -FilePath $app.FullName -ArgumentList '--screenshot', $shot -Wait -PassThru
          $env:PATH = $savedPath
          if ($run.ExitCode -ne 0 -or -not (Test-Path $shot)) { Write-Error "Packaged app failed: exit $($run.ExitCode)"; exit 1 }
          gh release upload "$env:TAG" $zip.FullName --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Add checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ github.event_name == 'workflow_dispatch' && !inputs.latest && 'false' || 'true' }}
        run: |
          mkdir dist
          gh release download "$TAG" --dir dist --pattern '*.zip' --pattern '*.deb'
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest="$LATEST"
