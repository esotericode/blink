name: Native Linux slice
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 qt6-base-dev qt6-base-dev-tools xvfb xauth
      - name: Build the native application and original ROM
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOBSERVATORY_STRICT_DEPENDENCIES=ON
          cmake --build build --parallel 2
      - name: Verify core parity, inspection, stepping, widgets, ROM, vendor
        run: ctest --test-dir build --output-on-failure
      - name: Verify native X11 interactions
        run: xvfb-run -a ./build/widget_tests
      - name: Verify install and package generation
        run: |
          cmake --install build --prefix "$PWD/out/install"
          cpack --config build/CPackConfig.cmake -B out
          dpkg-deb --info out/console-observatory_*_amd64.deb
